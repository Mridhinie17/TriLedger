# Matching Tolerances and Anomaly Thresholds for TriLedger
matching:
  # Line-item quantity must match exactly between PO, Goods Receipt, and Invoice
  quantity_tolerance_pct: 0.0

  # Unit price tolerance: allowable percentage deviation between PO unit price and Invoice unit price
  price_tolerance_pct: 1.0
  # Maximum absolute unit price deviation allowed regardless of percentage
  price_tolerance_absolute_base: 50.0  # INR 50
  price_tolerance_absolute_usd: 1.0    # USD 1

  # Foreign exchange rate deviation tolerance against official ECB rate on invoice date
  fx_rate_tolerance_pct: 1.5

  # Tax calculation allowable deviation (for rounding pennies / paise)
  tax_tolerance_absolute_base: 1.0     # INR 1.00
  tax_tolerance_absolute_usd: 0.05     # USD 0.05

  # RapidFuzz duplicate detection similarity score threshold (0-100)
  duplicate_similarity_threshold: 90.0

  # IsolationForest contamination rate for secondary unsupervised anomaly signal
  isolation_forest_contamination: 0.05

dataset:
  seed: 42
  total_invoices: 800
  defect_rate: 0.20        # 20% defective invoices (160 defective)
  scanned_rate: 0.10       # 10% rasterized scanned PDFs for OCR fallback testing (80 invoices)
  base_currency: "INR"
  foreign_currencies:
    - "USD"
    - "EUR"
    - "JPY"
