name: TriLedger CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    name: Run Pytest Test Suite & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies (Poppler & Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed Deterministic Synthetic SAP Database
        run: |
          python run_seed.py

      - name: Run Full Pytest Verification Suite
        run: |
          pytest -v

      - name: Install & Build Google Stitch React Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Export Power BI Data Marts Verification
        run: |
          python marts/exporter.py
