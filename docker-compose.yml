version: "3.8"

services:
  triledger-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triledger-app
    ports:
      - "8000:8000"
    environment:
      - TRILEDGER_ENV=production
      - PORT=8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  triledger-workbench:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triledger-workbench
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - TRILEDGER_ENV=production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - triledger-app
